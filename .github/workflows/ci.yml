name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cap_test
          POSTGRES_USER: cap
          POSTGRES_PASSWORD: cap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test (unit)
        run: cargo test --locked

      - name: test (integration)
        env:
          DATABASE_URL: postgres://cap:cap@localhost:5432/cap_test
        run: cargo test --locked -- --ignored --test-threads=1

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: contract tests
        env:
          DATABASE_URL: postgres://cap:cap@localhost:5432/cap_test
          WEB_URL: http://127.0.0.1:8080
          SIGN_SECRET: ci-contract-secret-ci-contract
          CAP_SIGNUPS: "true"
          STORAGE_DIR: /tmp/cap-contract-storage
          PORT: "8080"
          RUST_LOG: warn
        run: |
          cargo build --locked
          rm -rf "$STORAGE_DIR"
          mkdir -p "$STORAGE_DIR"
          ./target/debug/cap-server &
          echo $! > /tmp/cap-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health
          bash scripts/contract-test.sh
          kill "$(cat /tmp/cap-server.pid)"

      - name: build
        run: cargo build --release --locked

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cap-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
