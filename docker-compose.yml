services:
  cap-server:
    image: ghcr.io/lawrence-millard/cap-rust:latest
    # To build locally instead of pulling the published image:
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEB_URL: ${WEB_URL}
      CAP_SIGNUPS: ${CAP_SIGNUPS:-true}
      SIGN_SECRET: ${SIGN_SECRET}
      STORAGE_DIR: /data
      PORT: 8080
      RUST_LOG: info
    volumes:
      - cap-data:/data

volumes:
  cap-data:
    driver: local
